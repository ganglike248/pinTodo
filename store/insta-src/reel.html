<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PinTodo 릴스 영상</title>
<style>
@font-face { font-family: P; src: url("work/font/Pretendard.woff2") format("woff2"); font-weight: 100 900; }
/* 릴스 9:16 (1080×1920). reel.html?id=이름 으로 열고, render_reel.py가 시각을 직접 넣어(seek) 한 프레임씩 찍음.
   모든 움직임은 CSS 애니메이션이고 시작 시각은 요소마다 --d(초)로 줌.
   글자는 위 250px·아래 420px(릴스 화면의 계정·설명·버튼 자리)을 피해서 둠. 색·글꼴·알림 카드는 게시물(post.html)과 같음 */
:root { --ink: #191f28; --body: #4e5968; --mute: #8b95a1; --bg: #f3f5f7; --blue: #3182f6; --deep: #2272eb; --ease: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: P, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
/* 장면: --at에 아래에서 한 장처럼 올라와 앞 장면을 덮고, --out에는 살짝 물러남 */
.sc { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  animation: enter 1s cubic-bezier(.22, 1, .3, 1) both var(--at), leave 1s cubic-bezier(.3, 0, .2, 1) forwards var(--out), fout .01s linear forwards calc(var(--out) + 1.1s); }
.sc.blue { background: var(--deep); color: #fff; }
.sc.dark { background: #171c24; color: #fff; }
.sc.first { animation: leave 1s cubic-bezier(.3, 0, .2, 1) forwards var(--out), fout .01s linear forwards calc(var(--out) + 1.1s); }
.sc.last { animation: enter 1s cubic-bezier(.22, 1, .3, 1) both var(--at); }
@keyframes enter { from { transform: translateY(100%); border-radius: 90px 90px 0 0 } to { transform: none; border-radius: 0 } }
@keyframes leave { from { transform: none; filter: brightness(1) } to { transform: translateY(-90px); filter: brightness(.8) } }
@keyframes fin { from { opacity: 0 } to { opacity: 1 } }
@keyframes fout { from { opacity: 1 } to { opacity: 0 } }
/* 아래에서 떠오르며 나타남 */
.in { animation: rise 1.1s var(--ease) both var(--d); }
@keyframes rise { from { opacity: 0; transform: translateY(38px) } to { opacity: 1; transform: none } }
/* 정해진 동안만 보이는 글자(시계·설명): --a에 나타나 --b에 사라짐 */
.tl { position: absolute; left: 80px; right: 80px; opacity: 0; animation: tin .9s var(--ease) both var(--a), tout .5s cubic-bezier(.4, 0, 1, 1) forwards var(--b); }
@keyframes tin { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: none } }
@keyframes tout { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(-22px) } }
.h { position: absolute; left: 80px; right: 80px; font-weight: 700; letter-spacing: -4.5px; line-height: 1.22; }
.h span { display: block; }
.h em { font-style: normal; color: var(--blue); }
.dark .h em { color: #6aa8ff; }
.blue .h .dim { color: rgba(255,255,255,.7); }
.cap { position: absolute; left: 80px; right: 80px; font-size: 46px; font-weight: 600; letter-spacing: -1.3px; }
.cap u { text-decoration: none; display: inline-block; background: var(--blue); color: #fff; font-size: 40px; padding: 6px 28px 8px; border-radius: 40px; margin-right: 10px; vertical-align: 3px; }
.brand { position: absolute; left: 80px; display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 700; letter-spacing: -.8px; }
.brand img { width: 58px; height: 58px; border-radius: 16px; }
.tag { position: absolute; left: 80px; display: inline-flex; align-items: center; gap: 14px; height: 80px; padding: 0 34px; border-radius: 40px; background: #e2e6ea; color: var(--body); font-size: 38px; font-weight: 700; letter-spacing: -.8px; }
.tag.b { background: var(--blue); color: #fff; padding-left: 16px; }
.tag img { width: 52px; height: 52px; border-radius: 50%; }
.clock { font-size: 150px; font-weight: 700; letter-spacing: -6px; line-height: 1.1; }
.note { font-size: 56px; font-weight: 700; letter-spacing: -2px; }
/* 알림 카드 (기준 너비 620, .z에서 1.484배) */
.z { position: absolute; left: 80px; width: 620px; transform: scale(1.484); transform-origin: 0 0; }
.z > div { display: flex; flex-direction: column; gap: 14px; }
.n { background: #fff; border-radius: 32px; padding: 28px 32px 30px; color: var(--ink); }
.n .hd { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 500; color: var(--mute); line-height: 36px; }
.n .hd img, .n .hd i { width: 36px; height: 36px; border-radius: 50%; }
.n .hd i { background: #b0b8c1; display: flex; align-items: center; justify-content: center; }
.n .hd b { color: var(--body); font-weight: 600; }
.n .t { margin-top: 12px; font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 44px; }
.n .d { margin-top: 2px; font-size: 27px; font-weight: 500; color: var(--body); letter-spacing: -.5px; line-height: 38px; }
.n .a { margin-top: 24px; display: flex; gap: 12px; }
.n .a span { flex: 1; text-align: center; font-size: 28px; font-weight: 700; color: var(--blue); background: #e8f3ff; border-radius: 36px; line-height: 72px; letter-spacing: -.6px; }
.n .a span.p { background: var(--blue); color: #fff; }
.dimc { opacity: .55; }
.slot { position: relative; }
.slot .hole { position: absolute; inset: 0; border-radius: 32px; border: 2px dashed #c5ccd4; display: flex; align-items: center; justify-content: center; font-size: 27px; font-weight: 600; color: var(--body); letter-spacing: -.5px; }
.slot .hole span { opacity: 0; animation: fin .8s ease-out both var(--d); }
/* 밀려 나감: 손가락에 끌리듯 조금 움직였다가 빠져나감 */
.sw { animation: sw 1s linear both var(--d); }
@keyframes sw {
  0% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1) }
  28% { transform: translateX(46px); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .75, .5) }
  100% { transform: translateX(780px); opacity: 0 }
}
/* 아래 알림이 올라와 빈자리를 메움 */
.below { animation: closegap .9s cubic-bezier(.3, 0, .15, 1) both var(--d); }
@keyframes closegap { from { transform: none } to { transform: translateY(-204px) } }
/* 밀려 나갔다가 다시 나타남: 두 번(bounce) / 한 번(bounce1) */
.bn { animation: bounce 3s linear both var(--d); }
@keyframes bounce {
  0% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1) }
  5% { transform: translateX(40px); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .75, .5) }
  18% { transform: translateX(780px); opacity: 0 }
  25% { transform: translateY(-26px) scale(.96); opacity: 0; animation-timing-function: cubic-bezier(.2, .9, .3, 1.15) }
  42% { transform: none; opacity: 1 }
  54% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1) }
  59% { transform: translateX(40px); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .75, .5) }
  72% { transform: translateX(780px); opacity: 0 }
  79% { transform: translateY(-26px) scale(.96); opacity: 0; animation-timing-function: cubic-bezier(.2, .9, .3, 1.15) }
  96%, 100% { transform: none; opacity: 1 }
}
.bn1 { animation: bounce1 1.9s linear both var(--d), done .8s cubic-bezier(.4, 0, .2, 1) forwards var(--e, 999s); }
@keyframes bounce1 {
  0% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .6, 1) }
  9% { transform: translateX(40px); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .75, .5) }
  32% { transform: translateX(780px); opacity: 0 }
  45% { transform: translateY(-26px) scale(.96); opacity: 0; animation-timing-function: cubic-bezier(.2, .9, .3, 1.15) }
  78%, 100% { transform: none; opacity: 1 }
}
@keyframes done { from { transform: none; opacity: 1 } to { transform: scale(.96); opacity: 0 } }
/* 완료 버튼을 누름 */
.pr { animation: press 1.1s cubic-bezier(.2, .7, .3, 1) both var(--d); }
@keyframes press { 0% { box-shadow: 0 0 0 0 rgba(49,130,246,.45) } 30% { box-shadow: 0 0 0 12px rgba(49,130,246,.28) } 100% { box-shadow: 0 0 0 22px rgba(49,130,246,0) } }
/* 말풍선 */
.say { position: absolute; background: #fff; border-radius: 52px 52px 52px 14px; padding: 40px 52px; font-size: 54px; font-weight: 600; letter-spacing: -1.6px; animation: bubble .9s cubic-bezier(.2, 1.15, .35, 1) both var(--d); transform-origin: 0 100%; }
.say.r { border-radius: 52px 52px 14px 52px; transform-origin: 100% 100%; }
@keyframes bubble { from { opacity: 0; transform: translateY(28px) scale(.9) } 55% { opacity: 1 } to { opacity: 1; transform: none } }
/* 실제 화면 */
.ph { position: absolute; left: 102px; top: 730px; width: 876px; height: 1400px; border: 14px solid var(--ink); border-radius: 100px; background: var(--bg); overflow: hidden;
  animation: up 1.3s var(--ease) both var(--d); }
@keyframes up { from { opacity: 0; transform: translateY(120px) } to { opacity: 1; transform: none } }
.ph img { display: block; width: 848px; animation: drift var(--len) cubic-bezier(.3, 0, .3, 1) both var(--d); }
@keyframes drift { from { transform: translateY(0) } to { transform: translateY(var(--by, -90px)) } }
/* 마지막 장면 */
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.end .ic { margin-top: 420px; width: 200px; height: 200px; border-radius: 52px; border: 5px solid rgba(255,255,255,.9); animation: pop 1.1s cubic-bezier(.2, 1.2, .3, 1) both var(--d); }
@keyframes pop { from { opacity: 0; transform: scale(.72) } 50% { opacity: 1 } to { opacity: 1; transform: none } }
.end .h { position: static; margin-top: 70px; font-size: 94px; letter-spacing: -4.2px; }
.search { margin-top: 110px; width: 920px; height: 144px; border-radius: 72px; background: #fff; color: var(--ink); display: flex; align-items: center; gap: 24px; padding: 0 54px; font-size: 52px; font-weight: 600; letter-spacing: -1px; }
.search i { font-style: normal; opacity: 0; animation: fin .12s ease-out both var(--d); }
.search span { margin-left: auto; font-size: 34px; font-weight: 500; color: var(--mute); letter-spacing: -.3px; }
.end .go { margin-top: 44px; font-size: 40px; font-weight: 500; letter-spacing: -.8px; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const ICON = "../icon-512.png";
const ic = (d, c, w, sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const BELL = '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>', CAL = '<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/>', FIND = '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>';
const f = t => (+t).toFixed(2) + "s";
// 알림 카드. press(초)를 주면 그 시각에 [완료]가 눌림
function noti(n) {
  return `<div class="n ${n.cls || ""}"><div class="hd">${n.app ? `<i style="background:${n.c || "#b0b8c1"}">${ic(n.g || BELL, "#fff", 22)}</i>` : `<img src="${ICON}">`}<b>${n.app || "PinTodo"}</b><span>· ${n.when || "지금"}</span></div>
    <div class="t">${n.title}</div><div class="d">${n.memo}</div>
    ${n.open ? `<div class="a"><span class="p ${n.press ? "pr" : ""}" style="--d:${f(n.press || 0)}">완료</span><span>10분 뒤</span><span>미루기…</span></div>` : ""}</div>`;
}
const scene = (cls, at, out, body) => `<div class="sc ${cls}" style="--at:${f(at)};--out:${f(out)}">${body}</div>`;
// 정해진 동안만 보이는 글자: a에 나타나 b에 사라짐(b 생략 = 장면 끝까지)
const tl = (html, top, a, b, cls = "") => `<div class="tl ${cls}" style="top:${top}px;--a:${f(a)};--b:${f(b || 999)}">${html}</div>`;
// 실제 화면 장면: 제목 두 줄 + shots/이름.png (up = 위에서 잘라낼 높이, by = 장면 동안 천천히 올라가는 양)
const shotScene = (at, out, a, b, name, up, by = -90) => scene("", at, out, `
  <div class="h" style="top:290px;font-size:98px"><span class="in" style="--d:${f(at + .3)}">${a}</span><span class="in" style="--d:${f(at + .5)}"><em>${b}</em></span></div>
  <div class="ph" style="--d:${f(at + .35)}"><div style="margin-top:${-up}px"><img src="shots/${name}.png" style="--d:${f(at + 1.2)};--len:${f(out - at - .8)};--by:${by}px"></div></div>`);
// 마지막 장면(받기): 아이콘 → 두 줄 → 검색창에 PinTodo가 한 글자씩
const endScene = (at, l1, l2) => `<div class="sc blue last" style="--at:${f(at)}"><div class="end"><img class="ic" src="${ICON}" style="--d:${f(at + .3)}">
    <div class="h"><span class="in" style="--d:${f(at + .55)}">${l1}</span><span class="in" style="--d:${f(at + .75)}">${l2}</span></div>
    <div class="search in" style="--d:${f(at + 1.3)}">${ic(FIND, "#8b95a1", 56, 2.2)}<div>${[..."PinTodo"].map((ch, i) => `<i style="--d:${f(at + 1.9 + i * .11)}">${ch}</i>`).join("")}</div><span>Google Play</span></div>
    <div class="go in" style="--d:${f(at + 2.9)}">Google Play에서 검색해 보세요</div></div></div>`;

const reels = {
  // 소개: 관심 끌기 → 공감 → 해결(지워도 다시 뜸) → 실제 화면 세 개(한 장면 3.4초씩, 기능을 읽을 수 있게) → 없는 것 → 받기
  intro: () => {
    const A = 0, B = 3.4, C = 7.5, D1 = 12.7, D2 = 16.1, D3 = 19.5, E = 22.9, F = 26.1, END = 30.5;
    return [END,
      scene("s1 blue first", A, B, `
        <div class="h" style="top:290px;font-size:104px"><span class="dim">‘이따 해야지’ 하고</span><span class="dim">지운 알림,</span><span class="in" style="--d:.7s">결국 안 했죠?</span></div>
        <div class="z" style="top:800px"><div>
          ${noti({ cls: "dimc", app: "캘린더", c: "#6f8ff5", g: CAL, title: "관리비 납부", memo: "오늘까지", when: "2시간 전" })}
          <div class="slot"><div class="sw" style="--d:1.6s">${noti({ app: "리마인더", title: "택배 반품 신청", memo: "오늘 자정까지" })}</div></div>
          <div class="below" style="--d:2.35s">${noti({ cls: "dimc", app: "리마인더", title: "영양제 먹기", memo: "오후 9:00", when: "어제" })}</div>
        </div></div>`),
      scene("", B, C, `
        <div class="h" style="top:290px;font-size:104px"><span class="in" style="--d:${f(B + .25)}">이런 적,</span><span class="in" style="--d:${f(B + .45)}">한 번쯤 있죠</span></div>
        <div class="say" style="left:80px;top:640px;--d:${f(B + .9)}">아까 그 알림… 뭐였더라?</div>
        <div class="say r" style="right:80px;top:850px;--d:${f(B + 1.5)}">영양제 먹었나? 안 먹었나?</div>
        <div class="say" style="left:80px;top:1060px;--d:${f(B + 2.1)}">반품 기한이 어제까지였네</div>
        <div class="cap in" style="top:1300px;font-size:60px;font-weight:700;letter-spacing:-2px;--d:${f(B + 2.9)}">기억력 탓이 아니에요.<br><span style="color:var(--body);font-weight:600">알림은 밀면 끝이니까요.</span></div>`),
      scene("", C, D1, `
        <div class="brand in" style="top:280px;--d:${f(C + .25)}"><img src="${ICON}">PinTodo</div>
        <div class="h" style="top:380px;font-size:124px"><span class="in" style="--d:${f(C + .4)}">그래서, 지워도</span><span class="in" style="--d:${f(C + .8)}"><em>다시 떠요</em></span></div>
        <div class="z" style="top:860px"><div class="in" style="--d:${f(C + .5)}"><div class="slot"><div class="hole"></div><div class="bn" style="--d:${f(C + 1.2)}">${noti({ title: "택배 반품 신청", memo: "오늘 오후 11:59까지", open: true, press: C + 4.6 })}</div></div></div></div>
        <div class="cap in" style="top:1350px;--d:${f(C + 4.1)}"><u>완료</u>를 눌러야만 사라져요</div>`),
      shotScene(D1, D2, "한 줄만 쓰면", "시간까지 알아서", "newtodo", 109, -230),
      shotScene(D2, D3, "매일 하는 일은", "한 번만 적어요", "repeat", 133, -200),
      shotScene(D3, E, "홈 화면에서도", "바로 완료", "widget", 182, -60),
      scene("dark", E, F, `<div class="h" style="top:600px;font-size:132px;line-height:1.32"><span class="in" style="--d:${f(E + .35)}">광고 없음</span><span class="in" style="--d:${f(E + .85)}">로그인 없음</span><span class="in" style="--d:${f(E + 1.35)}"><em>전부 무료</em></span></div>`),
      endScene(F, "기억하려 애쓰지 말고", "상단바에 꽂아 두세요"),
    ];
  },
  // 같은 하루, 다른 결과: 영양제 알림 — 보통 알림은 아침에 밀고 밤에야 생각남 / PinTodo는 점심에도 그대로 있어서 먹고 완료
  day: () => {
    const A = 0, B = 3.4, C = 11.2, D = 20.4, E = 23.4, END = 27.8;
    return [END,
      scene("dark first", A, B, `
        <div class="h" style="top:520px;font-size:132px"><span>오늘도 영양제</span><span class="in" style="--d:.6s"><em>까먹었죠?</em></span></div>
        <div class="cap in" style="top:900px;font-size:54px;color:rgba(255,255,255,.75);--d:1.5s">알림은 분명 왔었는데요.</div>`),
      scene("", B, C, `
        <div class="tag in" style="top:280px;--d:${f(B + .3)}">보통 알림</div>
        ${tl("오전 9:00", 400, B + .5, B + 2.6, "clock")}${tl("오후 1:20", 400, B + 2.9, B + 4.9, "clock")}${tl("오후 11:40", 400, B + 5.2, 0, "clock")}
        <div class="z" style="top:700px"><div class="in" style="--d:${f(B + .7)}"><div class="slot"><div class="hole"></div><div class="sw" style="--d:${f(B + 1.5)}">${noti({ app: "리마인더", title: "영양제 먹기", memo: "오전 9:00" })}</div></div></div></div>
        ${tl("바빠서 일단 밀어 둠", 1040, B + 1.2, B + 2.6, "note")}${tl("알림창엔 아무것도 없어요", 1040, B + 3.2, B + 4.9, "note")}${tl("자려고 누워서야 생각나요", 1040, B + 5.6, 0, "note")}
        <div class="say" style="left:80px;top:1190px;--d:${f(B + 6.1)}">아 맞다, 영양제…</div>`),
      scene("", C, D, `
        <div class="tag b in" style="top:280px;--d:${f(C + .3)}"><img src="${ICON}">PinTodo</div>
        ${tl("오전 9:00", 400, C + .5, C + 3.3, "clock")}${tl("오후 1:20", 400, C + 3.6, 0, "clock")}
        <div class="z" style="top:700px"><div class="in" style="--d:${f(C + .7)}"><div class="slot"><div class="hole"><span style="--d:${f(C + 7.7)}">오늘 완료 · 내일 오전 9:00에 다시</span></div><div class="bn1" style="--d:${f(C + 1.4)};--e:${f(C + 7.1)}">${noti({ title: "영양제 먹기", memo: "매일 오전 9:00", open: true, press: C + 6.5 })}</div></div></div></div>
        ${tl("밀어도 다시 떠요", 1180, C + 2.2, C + 3.3, "note")}${tl("점심 먹고 봐도 그대로 있어요", 1180, C + 4, C + 5.8, "note")}${tl("먹고 나서 <span style='color:var(--blue)'>완료</span> 한 번이면 끝", 1180, C + 6.1, 0, "note")}`),
      scene("dark", D, E, `<div class="h" style="top:620px;font-size:124px;line-height:1.3"><span class="in" style="--d:${f(D + .35)}">의지가 아니라</span><span class="in" style="--d:${f(D + .85)}"><em>알림이 문제였어요</em></span></div>`),
      endScene(E, "잊어도 괜찮아요", "상단바가 기억해요"),
    ];
  },
};
const [END, ...scenes] = reels[new URLSearchParams(location.search).get("id") || "intro"]();
document.getElementById("stage").innerHTML = scenes.join("");
// 한 프레임 찍기: 모든 애니메이션을 멈추고 시각(ms)을 직접 넣음
window.seek = t => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t; } };
window.DURATION = END * 1000;
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { window.READY = true; });
</script>
