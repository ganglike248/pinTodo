<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PinTodo 인스타 게시물</title>
<style>
@font-face { font-family: P; src: url("work/font/Pretendard.woff2") format("woff2"); font-weight: 100 900; }
/* 인스타 피드 4:5 (1080×1350). 모든 장이 같은 틀: 위 96px에 작은 머리줄, 196px부터 제목(84px) → 설명(38px) → 그림.
   글자 크기는 26 / 38 / 84 세 단계만, 강조는 장마다 한 군데(파랑 또는 흰색 농도). 양옆 여백 96px */
:root { --ink: #191f28; --body: #4e5968; --mute: #8b95a1; --line: #dfe3e8; --bg: #f3f5f7; --blue: #3182f6; --deep: #2272eb; --m: 96px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: P, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
.post { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--ink); padding: 0 var(--m); }
.post.blue { background: var(--deep); color: #fff; }
.meta { position: absolute; left: var(--m); right: var(--m); top: 92px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.meta img { width: 36px; height: 36px; border-radius: 10px; }
.meta span { margin-left: auto; font-weight: 500; color: var(--mute); font-variant-numeric: tabular-nums; letter-spacing: .5px; }
.blue .meta span { color: rgba(255,255,255,.65); }
h1 { padding-top: 196px; font-size: 84px; font-weight: 700; line-height: 1.24; letter-spacing: -3.4px; white-space: pre-line; }
h1 em { font-style: normal; color: var(--blue); }
.blue h1 { color: rgba(255,255,255,.7); }
.blue h1 em { color: #fff; }
.sub { margin-top: 26px; font-size: 38px; font-weight: 500; line-height: 1.5; letter-spacing: -1px; color: var(--body); white-space: pre-line; }
.blue .sub { color: rgba(255,255,255,.82); }
.sub b { font-weight: 700; color: var(--ink); }
.blue .sub b { color: #fff; }
/* 알림 카드 (기준 너비 710, zoom으로 키움) */
.n { background: #fff; border-radius: 32px; padding: 28px 32px 30px; color: var(--ink); }
.n .h { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 500; color: var(--mute); line-height: 36px; }
.n .h img, .n .h i { width: 36px; height: 36px; border-radius: 50%; }
.n .h i { background: var(--c, #b0b8c1); display: flex; align-items: center; justify-content: center; }
.n .h b { color: var(--body); font-weight: 600; }
.n .t { margin-top: 12px; font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 44px; }
.n .d { margin-top: 2px; font-size: 27px; font-weight: 500; color: var(--body); letter-spacing: -.5px; line-height: 38px; }
.n .a { margin-top: 24px; display: flex; gap: 12px; }
.n .a span, .chip { flex: 1; text-align: center; font-size: 28px; font-weight: 700; color: var(--blue); background: #e8f3ff; border-radius: 36px; line-height: 72px; letter-spacing: -.6px; }
.n .a span.p, .chip.p { background: var(--blue); color: #fff; }
/* 1장: 폰 알림창에서 알림 하나가 옆으로 밀려 나가는 중 (다른 알림은 흐리게) */
.swipe { position: relative; height: 190px; }
.swipe .n { position: absolute; left: 236px; top: 0; width: 736px; }
.swipe .trail { position: absolute; left: 0; top: 0; width: 300px; height: 190px; border-radius: 32px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75)); }
.swipe .touch { position: absolute; left: 560px; top: 57px; width: 76px; height: 76px; border-radius: 50%; background: rgba(25,31,40,.12); border: 3px solid rgba(25,31,40,.22); }
.dim { opacity: .6; }
/* 2장 폰 */
.phone { position: absolute; left: 136px; top: 610px; width: 808px; height: 900px; border: 12px solid var(--ink); border-radius: 84px; background: #e6e9ee; overflow: hidden; }
.phone .sb { height: 84px; padding: 14px 52px 0; display: flex; align-items: center; justify-content: space-between; font-size: 27px; font-weight: 600; color: var(--ink); }
.phone .list { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(rgba(243,245,247,0), var(--bg) 85%); }
/* 실제 앱 화면 (shots/*.png = 스토어 스크린샷에서 폰 화면만 잘라 낸 700×1504, 크기 그대로 써서 선명하게) */
.shot { position: absolute; left: 178px; top: 560px; width: 724px; height: 900px; border: 12px solid var(--ink); border-radius: 84px; background: var(--bg); overflow: hidden; }
.shot img { display: block; width: 700px; }
/* 목록 */
.list2 { display: flex; flex-direction: column; }
.list2 > div { display: flex; align-items: center; gap: 32px; border-top: 2px solid var(--line); font-size: 38px; font-weight: 600; letter-spacing: -1.1px; }
.list2 > div:last-child { border-bottom: 2px solid var(--line); }
.list2 .chip { flex: none; width: 190px; line-height: 68px; }
.list2 b { font-weight: 700; color: var(--blue); }
/* 2번 게시물 */
.n .t em { font-style: normal; color: var(--blue); }
.acts { position: relative; display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
.acts span { background: #fff; color: var(--body); font-size: 26px; font-weight: 600; line-height: 68px; padding: 0 30px; border-radius: 34px; letter-spacing: -.5px; }
.acts .touch { position: absolute; right: 52px; top: -4px; width: 76px; height: 76px; border-radius: 50%; background: rgba(25,31,40,.12); border: 3px solid rgba(25,31,40,.22); }
.lab { font-size: 28px; font-weight: 700; letter-spacing: -.5px; color: var(--mute); margin: 0 0 16px 4px; }
.lab.b { color: var(--blue); }
.slot2 { height: 238px; border: 3px dashed #c5ccd4; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 600; letter-spacing: -.8px; color: var(--mute); }
.opt { background: #fff; border-radius: 40px; padding: 40px 44px; display: flex; align-items: center; }
.opt b { display: block; font-size: 42px; font-weight: 700; letter-spacing: -1.2px; }
.opt span { display: block; margin-top: 6px; font-size: 32px; font-weight: 500; letter-spacing: -.8px; color: var(--body); }
.opt i { margin-left: auto; flex: none; position: relative; width: 108px; height: 62px; border-radius: 31px; background: var(--blue); }
.opt i::after { content: ""; position: absolute; right: 7px; top: 7px; width: 48px; height: 48px; border-radius: 50%; background: #fff; }
/* 2번 게시물 1장: 어두운 바탕, 폰 틀 없이 알림 두 개 + 크게 그린 '모두 지우기' 버튼 (1번 게시물 첫 장과 다르게 보이도록) */
.post.dark { background: #171c24; }
.dark h1 em { color: #6aa8ff; }
.acts2 { display: flex; justify-content: flex-end; gap: 44px; margin-top: 56px; }
.acts2 span { position: relative; font-size: 34px; font-weight: 700; line-height: 92px; padding: 0 44px; border-radius: 46px; letter-spacing: -.8px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.55); }
.acts2 span.on { background: #fff; color: var(--ink); box-shadow: 0 0 0 14px rgba(255,255,255,.13), 0 0 0 32px rgba(255,255,255,.06); }
/* 3번 게시물: 첫 장은 미루기 알람 아이콘 색(노랑) 바탕 + 크게 그린 선택지 */
.post.amber { background: #ffc83d; }
.amber .meta span { color: rgba(25,31,40,.55); }
.amber h1 { color: rgba(25,31,40,.5); }
.amber h1 em { color: var(--ink); }
.amber .sub { color: rgba(25,31,40,.75); }
.big { display: flex; flex-direction: column; gap: 22px; margin-top: 104px; }
.big div { height: 150px; border-radius: 75px; background: rgba(255,255,255,.6); display: flex; align-items: center; padding: 0 56px; font-size: 52px; font-weight: 700; letter-spacing: -1.6px; }
.big div span { margin-left: auto; font-size: 34px; font-weight: 500; letter-spacing: -.8px; opacity: .6; }
.big div.on { background: var(--ink); color: #fff; }
.n .a span.hit { box-shadow: 0 0 0 9px rgba(49,130,246,.22); }
.opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 64px; }
.opts span { flex: 0 0 calc((100% - 32px) / 3); text-align: center; line-height: 108px; border-radius: 54px; font-size: 36px; font-weight: 700; letter-spacing: -.9px; background: #fff; color: var(--mute); }
.opts span.on { background: var(--blue); color: #fff; }
/* 4번 게시물: 첫 장은 초록 바탕 + 크게 그린 입력창과 읽어 낸 일정 */
.post.green { background: #0c9a6a; }
.type { margin-top: 120px; height: 164px; border-radius: 44px; background: #fff; color: var(--ink); display: flex; align-items: center; padding: 0 52px; font-size: 52px; font-weight: 600; letter-spacing: -1.6px; }
.type i { width: 5px; height: 64px; margin-left: 8px; border-radius: 3px; background: var(--blue); }
.down { display: block; margin: 36px auto; }
.res { display: flex; gap: 20px; }
.res div { flex: 1; border-radius: 40px; background: rgba(255,255,255,.16); padding: 34px 40px 38px; font-size: 44px; font-weight: 700; letter-spacing: -1.3px; }
.res div span { display: block; margin-bottom: 8px; font-size: 28px; font-weight: 600; letter-spacing: -.5px; color: rgba(255,255,255,.7); }
.ex > div b { margin-left: auto; }
/* 5번 게시물: 첫 장은 보라 바탕 + 요일 동그라미(오늘만 물음표) */
.post.violet { background: #6548f0; }
.week { display: flex; justify-content: space-between; margin-top: 110px; }
.week div { width: 108px; text-align: center; font-size: 28px; font-weight: 600; color: rgba(255,255,255,.7); }
.week i { display: flex; align-items: center; justify-content: center; width: 108px; height: 108px; margin-bottom: 18px; border-radius: 50%; font-style: normal; font-size: 52px; font-weight: 800; background: rgba(255,255,255,.2); }
.week .now { color: #fff; font-weight: 700; }
.week .now i { background: #fff; color: #6548f0; }
.week .yet i { background: none; border: 3px solid rgba(255,255,255,.3); }
.opt em { flex: none; margin-right: 32px; width: 76px; height: 76px; border-radius: 50%; background: #e8f3ff; display: flex; align-items: center; justify-content: center; }
/* 마지막 장 */
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.end > img { margin-top: 290px; width: 136px; height: 136px; border-radius: 36px; border: 4px solid rgba(255,255,255,.9); }
.end h1 { padding-top: 56px; color: #fff; }
.end .spec { margin-top: 44px; display: flex; font-size: 34px; font-weight: 600; letter-spacing: -.8px; }
.end .spec span { padding: 0 30px; border-left: 2px solid rgba(255,255,255,.35); line-height: 34px; }
.end .spec span:first-child { border: 0; }
.end .search { position: absolute; left: var(--m); right: var(--m); bottom: 190px; height: 116px; border-radius: 58px; background: #fff; display: flex; align-items: center; gap: 20px; padding: 0 44px; color: var(--ink); font-size: 40px; font-weight: 600; letter-spacing: -1px; }
.end .search span { margin-left: auto; font-size: 28px; font-weight: 500; color: var(--mute); letter-spacing: -.3px; }
.end .more { margin-top: 30px; font-size: 30px; font-weight: 500; letter-spacing: -.6px; color: rgba(255,255,255,.75); }
.end .os { position: absolute; left: 0; right: 0; bottom: 118px; font-size: 28px; font-weight: 500; color: rgba(255,255,255,.75); letter-spacing: -.3px; }
</style>
</head>
<body>
<div id="post"></div>
<script>
// 게시물(여러 장)은 posts에 추가하고 post.html?id=이름&n=장 으로 연다. render.sh가 store/insta/이름/1.png… 로 저장
const ICON = "../icon-512.png";
const ic = (d, c, w, sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const BELL = '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>', CHECK = '<path d="M5 12.5l4.5 4.5L19 7.5"/>', FIND = '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>';
const STATUS = `<svg width="92" height="28" viewBox="0 0 92 28" fill="#191f28"><path d="M2 20h4v6H2zM9 15h4v11H9zM16 10h4v16h-4zM23 5h4v21h-4z"/><rect x="42" y="6" width="42" height="18" rx="5" fill="none" stroke="#191f28" stroke-width="2"/><rect x="45" y="9" width="28" height="12" rx="2.5"/><rect x="86" y="11" width="3" height="8" rx="1.5"/></svg>`;
// 알림 카드: app이 있으면 다른 앱(회색 종), 없으면 PinTodo
function noti(n) {
  return `<div class="n"><div class="h">${n.app ? `<i style="--c:${n.c || "#b0b8c1"}">${ic(n.g || BELL, "#fff", 22)}</i>` : `<img src="${ICON}">`}<b>${n.app || "PinTodo"}</b><span>· ${n.when || "지금"}</span></div>
    <div class="t">${n.title}</div><div class="d">${n.memo}</div>
    ${n.open ? `<div class="a"><span class="p">완료</span><span class="${n.hit ? "hit" : ""}">10분 뒤</span><span>미루기…</span></div>` : ""}</div>`;
}
const CAL = '<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/>';
// 실제 화면: up = 위에서 잘라낼 높이. h를 주면 그 높이까지만 보여 주고 아래는 흰 바탕(시트처럼 화면 아래 모서리가 보이면 안 될 때)
const shot = (name, up, h) => `<div class="shot" style="${h ? "background:#fff" : ""}"><div style="${h ? `height:${h}px;overflow:hidden` : ""}"><img src="shots/${name}.png" style="margin-top:${-up}px"></div></div><div class="fade"></div>`;
const page = (body, cls = "") => (i, total) => `<div class="post ${cls}"><div class="meta"><img src="${ICON}">PinTodo<span>${i} / ${total}</span></div>${body}</div>`;
// 마지막 장(받기)은 모든 게시물이 같음
const END = page(`<div class="end"><img src="${ICON}">
      <h1>끝낼 때까지\n사라지지 않는 할 일</h1>
      <div class="spec"><span>광고 없음</span><span>로그인 없음</span><span>전부 무료</span></div>
      <div class="more">체크리스트 · 색 라벨 · 스마트워치 알림도 있어요</div>
      <div class="search">${ic(FIND, "#8b95a1", 44, 2.2)}PinTodo<span>Google Play</span></div>
      <div class="os">Google Play에서 검색해 보세요 · 안드로이드용</div></div>`, "blue");
const posts = {
  // 1번 게시물: 앱 소개. 1장 관심 끌기(+설명 한 줄에 답) → 2 핵심(지워도 다시 뜸) → 3 알림에서 바로 → 4 날짜 인식 → 5 반복 → 6 위젯(4~6은 실제 화면) → 7 이런 분께 → 8 받기
  "01-intro": [
    page(`<h1>‘이따 해야지’ 하고\n지운 알림,\n<em>결국 안 했죠?</em></h1>
      <div class="sub">그래서 <b>지워도 다시 뜨는</b> 할 일 알림을 만들었어요.</div>
      <div class="phone" style="top:690px"><div class="sb">9:41${STATUS}</div><div class="list">
        <div class="dim">${noti({ app: "캘린더", c: "#6f8ff5", g: CAL, title: "관리비 납부", memo: "오늘까지", when: "2시간 전" })}</div>
        <div class="swipe"><div class="trail"></div>${noti({ app: "리마인더", title: "택배 반품 신청", memo: "오늘 자정까지" })}<div class="touch"></div></div>
        <div class="dim">${noti({ app: "리마인더", title: "영양제 먹기", memo: "오후 9:00", when: "어제" })}</div></div></div>`, "blue"),
    page(`<h1>밀어서 지워도\n<em>다시 떠요</em></h1>
      <div class="sub"><b>[완료]</b>를 누를 때까지 상단바에 그대로 남아요.</div>
      <div class="phone"><div class="sb">9:41${STATUS}</div><div class="list">
        ${noti({ title: "택배 반품 신청", memo: "오늘 오후 11:59까지", open: true })}
        ${noti({ title: "영양제 먹기", memo: "매일 오후 9:00", when: "1시간 전" })}
        ${noti({ title: "엄마한테 전화하기", memo: "완료할 때까지", when: "3시간 전" })}</div></div><div class="fade"></div>`),
    page(`<h1>앱을 열 필요도\n<em>없어요</em></h1>
      <div class="sub">알림에 달린 버튼 세 개면 충분해요.</div>
      <div style="margin-top:44px;zoom:1.2507;width:710px">${noti({ title: "영양제 먹기", memo: "매일 오후 9:00", open: true })}</div>
      <div class="list2" style="margin-top:48px">${[["완료", "다 했으면 바로 끝", "p"], ["10분 뒤", "지금 바쁘면 조금 있다가 다시"], ["미루기…", "원하는 날짜와 시간으로"]].map(([c, t, p]) => `<div style="height:100px"><span class="chip ${p || ""}">${c}</span>${t}</div>`).join("")}</div>`),
    page(`<h1>‘내일 오후 3시 약국’
<em>이렇게만 쓰세요</em></h1>
      <div class="sub">날짜와 시간은 알아서 맞춰져요.</div>${shot("newtodo", 90)}`),
    page(`<h1>매일 하는 일은
<em>한 번만 적어요</em></h1>
      <div class="sub">매주·격주·매월·며칠마다, 그 시간에 다시 떠요.</div>${shot("repeat", 110)}`),
    page(`<h1>홈 화면에서도
<em>바로 완료</em></h1>
      <div class="sub">위젯에서 할 일을 보고, 끝내고, 미뤄요.</div>${shot("widget", 150)}`),
    page(`<h1>이런 분께\n<em>잘 맞아요</em></h1>
      <div class="list2" style="margin-top:96px">${["알림을 지우고 <b>“뭐였더라?”</b> 하는 분", "<b>영양제</b>를 먹었는지 헷갈리는 분", "<b>반품·공과금</b> 날짜를 자주 놓치는 분", "할 일 앱을 깔아 두고 <b>안 여는</b> 분"].map(t => `<div style="height:160px;gap:26px">${ic(CHECK, "#3182f6", 48, 2.6)}<div>${t}</div></div>`).join("")}</div>`),
    END,
  ],
  // 2번 게시물: 고정(지워도 다시 뜸) 자세히. 1장 관심 끌기('모두 지우기') → 2 보통 알림과 비교 → 3 다시 뜰 땐 조용히 → 4 신규 표시 → 5 할 일마다 끄기 → 6 받기
  "02-pin": [
    page(`<h1>‘모두 지우기’를 눌러도
<em>안 지워지는 알림</em></h1>
      <div class="sub">일부러 그렇게 만들었어요. <b>끝낼 때까지 잊지 않게.</b></div>
      <div style="margin-top:88px;zoom:1.2507;width:710px;display:flex;flex-direction:column;gap:13px">
        ${noti({ title: "택배 반품 신청", memo: "오늘 오후 11:59까지" })}
        ${noti({ title: "영양제 먹기", memo: "매일 오후 9:00", when: "1시간 전" })}</div>
      <div class="acts2"><span>알림 설정</span><span class="on">모두 지우기</span></div>`, "blue dark"),
    page(`<h1>똑같이 밀었는데
<em>하나만 남아요</em></h1>
